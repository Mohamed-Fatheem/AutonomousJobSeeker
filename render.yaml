services:
  - type: web
    name: autonomous-jobseeker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: CRON_TOKEN
        generateValue: true
      - key: REGISTRATION_INVITE_CODE
        sync: false
      - key: SESSION_HTTPS_ONLY
        value: "true"
      - key: ENABLE_CRON
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
