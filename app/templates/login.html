{% extends 'base.html' %}{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="eyebrow">SECURE WORKSPACE</div><h1>Welcome back.</h1><p class="sub">Your opportunities, resumes and application records stay in your own account.</p>
<form method="post" action="/login" class="panel auth-form"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Email<input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password"></label>
<button class="btn primary wide">Sign in <span>→</span></button><p class="fine">New workspace? <a href="/register">Create an account with your invite code</a>.</p>
</form></div>
{% endblock %}
